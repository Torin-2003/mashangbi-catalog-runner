name: Reseal encrypted catalog runner (one shot)
on:
  workflow_dispatch:
    inputs:
      expected_old_sha256:
        description: 'Currently pinned runner ciphertext SHA256 (64 lowercase hex)'
        required: true
        type: string
      transfer_sha256:
        description: 'Reviewed encrypted transfer SHA256 (64 lowercase hex)'
        required: true
        type: string
      mode:
        description: 'publish: CAS replace; recover: read-only verify a possibly completed write'
        required: true
        type: choice
        default: publish
        options: [publish, recover]
permissions:
  contents: read
concurrency:
  group: catalog-production
  cancel-in-progress: false
jobs:
  reseal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Torin-2003/mashangbi-catalog-runner' && vars.CATALOG_RUNNER_ENABLED == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/maintenance
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Reseal in memory; emit ciphertext digest only
        shell: bash
        run: |
          set +x
          ulimit -c 0
          node scripts/maintenance/reseal-runner.mjs
        env:
          NODE_OPTIONS: ''
          NODE_DEBUG: ''
          MAINTENANCE_MODE: ${{ inputs.mode }}
          EXPECTED_OLD_SHA256: ${{ inputs.expected_old_sha256 }}
          TRANSFER_SHA256: ${{ inputs.transfer_sha256 }}
          CATALOG_RUNNER_ENABLED: ${{ vars.CATALOG_RUNNER_ENABLED }}
          CATALOG_RUNNER_CODE_SHA256: ${{ vars.CATALOG_RUNNER_CODE_SHA256 }}
          CATALOG_CHECKPOINT_KEY: ${{ secrets.CATALOG_CHECKPOINT_KEY }}
          CATALOG_RESEAL_TRANSFER_KEY: ${{ secrets.CATALOG_RESEAL_TRANSFER_KEY }}
          CATALOG_PUBLISHER_APP_ID: ${{ vars.CATALOG_STATE_APP_ID }}
          CATALOG_PUBLISHER_INSTALLATION_ID: ${{ vars.CATALOG_STATE_INSTALLATION_ID }}
          CATALOG_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.CATALOG_STATE_APP_PRIVATE_KEY }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
